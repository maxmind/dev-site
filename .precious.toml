[commands.lint-scripts]
type = "lint"
cmd = [
  "pnpm",
  "run",
  "--silent",
  "lint:scripts"
]
invoke = "once"
# Any path args are appended to the whole script, so they land on the
# trailing `eslint .`, not on tsc. ESLint reports an explicitly-named file
# that it is configured to ignore as a warning, and --max-warnings=0 makes
# that fatal, so passing paths fails on eslint.config.mjs's ignore list.
path-args = "none"
include = ["assets/js/**", "bin/**/*.ts"]
ok-exit-codes = 0

[commands.stylelint-styles]
type="both"
cmd = [
  "pnpm",
  "exec",
  "stylelint"
]
invoke = "once"
lint-flags = []
tidy-flags = ["--fix"]
path-args = "absolute-file"
include = ["assets/scss/**"]
ok-exit-codes = 0

[commands.prettier-scripts]
type = "both"
cmd = [
  "pnpm",
  "exec",
  "prettier"
]
invoke = "once"
lint-flags = ["--check"]
tidy-flags = ["--write"]
path-args = "absolute-file"
include = ["assets/js/**", "bin/**/*.{ts}"]
ok-exit-codes = 0

[commands.cspell-content]
type="lint"
include = ["*.md"]
cmd = [
  "pnpm",
  "run",
  "--silent",
  "lint:cspell",
]
invoke = "once"
# The lint:cspell script supplies its own glob, so it needs no path args.
path-args = "none"
ok-exit-codes = 0

[commands.prettier-markdown]
type = "both"
include = [
    "assets/**/*.md",
    "content/**/*.md"
]
cmd = [
    "pnpm",
    "exec",
    "prettier",
    "--parser",
    "markdown",
    "--prose-wrap",
    "always",
]
invoke = "once"
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = 0
lint-failure-exit-codes = 1
ignore-stderr = ["Code style issues"]

[commands.format-content]
type = "tidy"
cmd = [
  "pnpm",
  "run",
  "--silent",
  "format:rawhtml"
]
invoke = "once"
path-args = "absolute-file"
include = ["content/**/*.md"]
ok-exit-codes = 0

[commands.check-shortcode-parity]
type = "lint"
cmd = [
  "pnpm",
  "run",
  "--silent",
  "lint:shortcode-parity"
]
invoke = "once"
# Finds its own targets relative to import.meta.url; ignores argv.
path-args = "none"
include = ["layouts/shortcodes/**/*.{html,md}"]
ok-exit-codes = 0

[commands.check-prettierignore-rawhtml]
type = "lint"
cmd = [
  "pnpm",
  "run",
  "--silent",
  "lint:prettierignore-rawhtml"
]
invoke = "once"
# Greps content/ for its own targets; ignores argv.
path-args = "none"
include = ["content/**/*.md", ".prettierignore"]
ok-exit-codes = 0

[commands.check-internal-links]
type = "lint"
cmd = [
  "pnpm",
  "run",
  "--silent",
  "lint:internal-links"
]
invoke = "once"
path-args = "absolute-file"
include = ["content/**/*.md", "layouts/**/*.html"]
ok-exit-codes = 0
